name: Testes da plataforma
on: pull_request

permissions:
  contents: read

jobs:
  permissoes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python backend/tests/test_permissoes.py

  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend/tests
      - run: python backend/tests/executar_navegador.py
        env:
          BROWSER_CHANNEL: chrome

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir atualização do changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -s CHANGELOG.md ] || git diff --quiet "$BASE...$HEAD_PR" -- CHANGELOG.md; then
            echo "::error::Atualize o CHANGELOG.md da raiz com uma descrição por commit deste PR."
            exit 1
          fi
